
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Nilai Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Program Nilai Mahasiswa</h2>

        <form id="formNilai">
            <label for="tugas">Nilai Tugas</label>
            <input type="number" id="tugas" min="0" max="100"
                   placeholder="Masukkan nilai tugas" required>

            <label for="uts">Nilai UTS</label>
            <input type="number" id="uts" min="0" max="100"
                   placeholder="Masukkan nilai UTS" required>

            <label for="uas">Nilai UAS</label>
            <input type="number" id="uas" min="0" max="100"
                   placeholder="Masukkan nilai UAS" required>

            <button type="submit">Hitung Nilai</button>
        </form>

        <div id="hasil" class="hasil" hidden>
            <h3>Hasil Penilaian</h3>
            <p id="nilaiAkhir"></p>
            <p id="predikat"></p>
            <p id="status"></p>
        </div>

        <p id="pesanError"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
